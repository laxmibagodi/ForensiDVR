name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install libewf tools (independent E01 reference for tests)
        run: sudo apt-get update && sudo apt-get install -y ewf-tools
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check forensidvr tests
          ruff format --check forensidvr tests
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=forensidvr --cov-report=term --cov-report=xml --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
